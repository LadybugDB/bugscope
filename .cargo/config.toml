# Use the prebuilt SHARED liblbug from ./liblbug (see scripts/download-liblbug.sh).
#
# Shared (not static) is required: the dlopen'd algo extension resolves
# ladybug symbols (e.g. GDSFunction::getLogicalPlan) from the host process at
# LOAD EXTENSION time. With a static liblbug.a, dead-code stripping drops
# unreferenced symbols and the extension fails to load. Mirrors
# ../bugscope/src-tauri/.cargo/config.toml.
#
# The icebug Rust crate's build script links libnetworkit from ./icebug
# (see scripts/download_icebug.sh).
[env]
LBUG_LIBRARY_DIR = { value = "liblbug", relative = true }
LBUG_INCLUDE_DIR = { value = "liblbug", relative = true }
LBUG_SHARED = "1"
ICEBUG_DIR = { value = "icebug", relative = true }

# Embed rpath so the binary finds the bundled shared libs at runtime:
# - dist archives ship `liblbug/` + `icebug/lib/` next to the binary
#   ($ORIGIN / @executable_path entries)
# - macOS .app bundles stage them under Contents/Frameworks
# - cargo dev/test binaries resolve ../../../ entries
#   (target/{debug,release}/deps/ -> repo root)
# Absolute well-known rpaths (macOS only): the algo extension is downloaded
# at runtime and its own LC_RPATHs point at its build machine, so its
# @rpath deps (libarrow, libomp, libnetworkit) expand against *this*
# binary's rpaths. These entries let it resolve from Homebrew / system
# locations with no DYLD_LIBRARY_PATH. Missing dirs are harmless.
[target.aarch64-apple-darwin]
rustflags = [
  "-C", "link-arg=-Wl,-rpath,/opt/homebrew/lib",
  "-C", "link-arg=-Wl,-rpath,/opt/homebrew/opt/apache-arrow/lib",
  "-C", "link-arg=-Wl,-rpath,/opt/homebrew/opt/libomp/lib",
  "-C", "link-arg=-Wl,-rpath,/usr/local/lib",
  "-C", "link-arg=-Wl,-rpath,/usr/local/opt/apache-arrow/lib",
  "-C", "link-arg=-Wl,-rpath,/usr/local/opt/libomp/lib",
  "-C", "link-arg=-Wl,-rpath,@executable_path",
  "-C", "link-arg=-Wl,-rpath,@executable_path/icebug/lib",
  "-C", "link-arg=-Wl,-rpath,@executable_path/liblbug",
  "-C", "link-arg=-Wl,-rpath,@executable_path/../Frameworks",
  "-C", "link-arg=-Wl,-rpath,@executable_path/../icebug/lib",
  "-C", "link-arg=-Wl,-rpath,@executable_path/../../liblbug",
  "-C", "link-arg=-Wl,-rpath,@executable_path/../../icebug/lib",
  "-C", "link-arg=-Wl,-rpath,@executable_path/../../../liblbug",
  "-C", "link-arg=-Wl,-rpath,@executable_path/../../../../liblbug",
  "-C", "link-arg=-Wl,-rpath,@executable_path/../../../icebug/lib",
  "-C", "link-arg=-Wl,-rpath,@executable_path/../../../../icebug/lib",
]

[target.x86_64-apple-darwin]
rustflags = [
  "-C", "link-arg=-Wl,-rpath,/opt/homebrew/lib",
  "-C", "link-arg=-Wl,-rpath,/opt/homebrew/opt/apache-arrow/lib",
  "-C", "link-arg=-Wl,-rpath,/opt/homebrew/opt/libomp/lib",
  "-C", "link-arg=-Wl,-rpath,/usr/local/lib",
  "-C", "link-arg=-Wl,-rpath,/usr/local/opt/apache-arrow/lib",
  "-C", "link-arg=-Wl,-rpath,/usr/local/opt/libomp/lib",
  "-C", "link-arg=-Wl,-rpath,@executable_path",
  "-C", "link-arg=-Wl,-rpath,@executable_path/icebug/lib",
  "-C", "link-arg=-Wl,-rpath,@executable_path/liblbug",
  "-C", "link-arg=-Wl,-rpath,@executable_path/../Frameworks",
  "-C", "link-arg=-Wl,-rpath,@executable_path/../icebug/lib",
  "-C", "link-arg=-Wl,-rpath,@executable_path/../../liblbug",
  "-C", "link-arg=-Wl,-rpath,@executable_path/../../icebug/lib",
  "-C", "link-arg=-Wl,-rpath,@executable_path/../../../liblbug",
  "-C", "link-arg=-Wl,-rpath,@executable_path/../../../../liblbug",
  "-C", "link-arg=-Wl,-rpath,@executable_path/../../../icebug/lib",
  "-C", "link-arg=-Wl,-rpath,@executable_path/../../../../icebug/lib",
]

[target.aarch64-unknown-linux-gnu]
rustflags = [
  "-C", "link-arg=-Wl,-rpath,$ORIGIN",
  "-C", "link-arg=-Wl,-rpath,$ORIGIN/icebug/lib",
  "-C", "link-arg=-Wl,-rpath,$ORIGIN/liblbug",
  "-C", "link-arg=-Wl,-rpath,$ORIGIN/../icebug/lib",
  "-C", "link-arg=-Wl,-rpath,$ORIGIN/../../liblbug",
  "-C", "link-arg=-Wl,-rpath,$ORIGIN/../../icebug/lib",
  "-C", "link-arg=-Wl,-rpath,$ORIGIN/../../../liblbug",
  "-C", "link-arg=-Wl,-rpath,$ORIGIN/../../../../liblbug",
  "-C", "link-arg=-Wl,-rpath,$ORIGIN/../../../icebug/lib",
  "-C", "link-arg=-Wl,-rpath,$ORIGIN/../../../../icebug/lib",
  # RPATH (not RUNPATH) so transitive deps like libarrow (needed by
  # libnetworkit.so) also resolve from these dirs.
  "-C", "link-arg=-Wl,--disable-new-dtags",
]

[target.x86_64-unknown-linux-gnu]
rustflags = [
  "-C", "link-arg=-Wl,-rpath,$ORIGIN",
  "-C", "link-arg=-Wl,-rpath,$ORIGIN/icebug/lib",
  "-C", "link-arg=-Wl,-rpath,$ORIGIN/liblbug",
  "-C", "link-arg=-Wl,-rpath,$ORIGIN/../icebug/lib",
  "-C", "link-arg=-Wl,-rpath,$ORIGIN/../../liblbug",
  "-C", "link-arg=-Wl,-rpath,$ORIGIN/../../icebug/lib",
  "-C", "link-arg=-Wl,-rpath,$ORIGIN/../../../liblbug",
  "-C", "link-arg=-Wl,-rpath,$ORIGIN/../../../../liblbug",
  "-C", "link-arg=-Wl,-rpath,$ORIGIN/../../../icebug/lib",
  "-C", "link-arg=-Wl,-rpath,$ORIGIN/../../../../icebug/lib",
  "-C", "link-arg=-Wl,--disable-new-dtags",
]
