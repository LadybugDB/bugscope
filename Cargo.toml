[package]
name = "bugscope"
version = "0.1.0"
edition = "2021"

[features]
default = ["icebug-analytics"]
icebug-analytics = ["dep:icebug"]

[dependencies]
gpui = "0.2"
lbug = { version = "0.21.1", features = ["arrow"] }
icebug = { version = "=13.2.0", optional = true }
arrow = { version = "56", default-features = false, features = ["ffi"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
