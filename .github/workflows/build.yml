name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pin the prebuilt liblbug release to the lbug crate version in Cargo.toml.
  LBUG_VERSION: "0.20.4"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        run: |
          # lbug's C++ bridge needs <format> (C++20): jammy's gcc-11 is too old.
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-13 g++-13 pkg-config libssl-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Run sccache
        uses: mozilla/sccache-action@v0.0.9

      - name: Cache prebuilt liblbug
        uses: actions/cache@v4
        with:
          # lbug's build script downloads the static lib here on every
          # clean cargo registry; keep it across runs keyed by version+OS.
          path: ~/.cargo/registry/src/**/lbug-*/.cache
          key: lbug-prebuilt-${{ env.LBUG_VERSION }}-${{ runner.os }}
          restore-keys: lbug-prebuilt-

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

  build:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            binary: bugscope
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: bugscope
          - platform: windows-2022
            target: x86_64-pc-windows-msvc
            binary: bugscope.exe

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install libomp openssl

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # lbug's C++ bridge needs <format> (C++20): jammy's gcc-11 is too old.
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-13 g++-13 pkg-config libssl-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      - name: Install OpenSSL (Windows)
        if: matrix.platform == 'windows-2022'
        run: |
          choco install openssl.light --no-progress -y
          $root = 'C:\Program Files\OpenSSL'
          echo "OPENSSL_DIR=$root" >> "$env:GITHUB_ENV"
          # Shining Light nests import libs under lib\VC\x64\MD (DLL) and
          # lib\VC\x64\MT (static); pick the first dir that exists.
          $lib = @('lib\VC\x64\MD', 'lib\VC\x64\MT', 'lib') |
            ForEach-Object { Join-Path $root $_ } |
            Where-Object { Test-Path (Join-Path $_ 'libssl.lib') } |
            Select-Object -First 1
          if (-not $lib) { Get-ChildItem $root | Select-Object FullName; exit 1 }
          echo "Windows OpenSSL lib dir: $lib"
          # Stage the import libs somewhere space-free: MSVC silently
          # mishandles the 'C:\Program Files\...' LIB entry (see the
          # truncated 'LIBPATH:C:\Program' in the link line).
          $stage = "$env:GITHUB_WORKSPACE\openssl-lib"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item (Join-Path $lib 'libssl.lib') $stage
          Copy-Item (Join-Path $lib 'libcrypto.lib') $stage
          Get-ChildItem $stage | Select-Object Name, Length
          echo "LIB=$stage" >> "$env:GITHUB_ENV"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run sccache
        uses: mozilla/sccache-action@v0.0.9

      - name: Cache prebuilt liblbug
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/src/**/lbug-*/.cache
          key: lbug-prebuilt-${{ env.LBUG_VERSION }}-${{ runner.os }}-${{ matrix.target }}
          restore-keys: lbug-prebuilt-

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary for release
        shell: bash
        run: |
          # Give each platform's binary a unique filename: macOS and Linux
          # both produce `bugscope`, which collides as release assets.
          src="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          if [[ "${{ matrix.binary }}" == *.exe ]]; then
            dst="bugscope-${{ matrix.target }}.exe"
          else
            dst="bugscope-${{ matrix.target }}"
          fi
          cp "$src" "$dst"
          echo "STAGED=$dst" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bugscope-${{ matrix.target }}
          path: ${{ env.STAGED }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
